services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile

    image: realestate-postgres:postgis-pgvector
    container_name: realestate-db
    environment:
      POSTGRES_DB: realestate_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Jen extensions + schéma. NEmountovat ./scripts – entrypoint pouští všechny .sql
      # abecedně s ON_ERROR_STOP=1, takže backfill_*.sql spadl a přerušil celý init.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - realestate-network
    restart: unless-stopped
    healthcheck:
      # pg_isready hlásí "healthy" i u prázdné databáze bez schématu – proto navíc
      # kontrola, že init skript proběhl (schéma + PostGIS). Jinak depends_on nechrání před ničím.
      test: ["CMD-SHELL", "pg_isready -U postgres -d realestate_dev && psql -U postgres -d realestate_dev -tAc \"select 1 from pg_namespace n, pg_extension e where n.nspname='re_realestate' and e.extname='postgis'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s   # ← dát systému čas nastartovat

  api:
    build:
      context: .
      dockerfile: src/RealEstate.Api/Dockerfile
      network: host  # Fix: systemd-resolved uses 127.0.0.53 which is unreachable inside build containers
    container_name: realestate-api
    ports:
      - "127.0.0.1:5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=realestate_dev
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD:-dev}
      - SCRAPER_API_BASE_URL=http://realestate-scraper:8001
      - API_KEY=${API_KEY:-dev-key-change-me}
      - Ollama__BaseUrl=http://192.168.11.199:11434
      - Ollama__VisionModel=llama3.2-vision:11b
      - Embedding__Provider=ollama
      - OpenRouter__ApiKey=${OPENROUTER_API_KEY:-}
      - OpenRouter__BaseUrl=https://openrouter.ai/api/v1
      - Groq__ApiKey=${GROQ_API_KEY:-}
      - Mistral__ApiKey=${MISTRAL_API_KEY:-}
      - OllamaCloud__ApiKey=${OLLAMA_CLOUD_API_KEY:-}
      - OllamaCloud__BaseUrl=https://ollama.com/v1
      - Anthropic__ApiKey=${ANTHROPIC_API_KEY:-}
      - Embedding__VectorDimensions=768
      - PHOTOS_PUBLIC_BASE_URL=${PUBLIC_API_URL:-http://localhost:5001}  # URL přístupná z prohlížeče pro stažené fotky
      # ── Účty a placená vrstva ──
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@realestate.local}   # přihlášení vlastníka (výchozí admin účet)
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}                    # při každém startu se heslo admina srovná s touto hodnotou
      - AUTH_SECRET=${AUTH_SECRET:-}                          # podpis bearer tokenů (prázdné = odvozeno z API_KEY)
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-http://localhost:5002}  # odkazy v e-mailech, návrat ze Stripe
      - Stripe__SecretKey=${STRIPE_SECRET_KEY:-}
      - Stripe__WebhookSecret=${STRIPE_WEBHOOK_SECRET:-}
      - Stripe__PriceHledacMonthly=${STRIPE_PRICE_HLEDAC_MONTHLY:-}
      - Stripe__PriceHledacYearly=${STRIPE_PRICE_HLEDAC_YEARLY:-}
      - Stripe__PriceProfiMonthly=${STRIPE_PRICE_PROFI_MONTHLY:-}
      - Stripe__PriceProfiYearly=${STRIPE_PRICE_PROFI_YEARLY:-}
      - Smtp__Host=${SMTP_HOST:-}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__User=${SMTP_USER:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__From=${SMTP_FROM:-}
      - Telegram__BotToken=${TELEGRAM_BOT_TOKEN:-}
      - Leads__NotifyEmail=${LEADS_NOTIFY_EMAIL:-}
      - Photos__DeleteStoredAfterClassification=${PHOTOS_DELETE_STORED_AFTER_CLASSIFICATION:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - realestate-network
      - traefik-network
    volumes:
      - ./logs/api:/app/logs
      - ./secrets:/app/secrets      # Google Drive credentials (rw – callback píše token)
      - /srv/realestate-uploads:/app/wwwroot/uploads  # ALL file uploads: listing photos + inspection photos
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: src/RealEstate.App/Dockerfile
      network: host  # Fix: systemd-resolved uses 127.0.0.53 which is unreachable inside build containers
    container_name: realestate-app
    ports:
      - "127.0.0.1:5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ApiBaseUrl=http://realestate-api:8080
      - ApiPublicUrl=${PUBLIC_API_URL:-http://localhost:5001}
      - ScrapingApiKey=${API_KEY:-dev-key-change-me}
      - MortgagePartnerUrl=${MORTGAGE_PARTNER_URL:-}         # odkaz na hypotečního partnera (UTM se doplní)
      - MortgageDefaultRate=${MORTGAGE_DEFAULT_RATE:-4.79}
      - ContactEmail=${CONTACT_EMAIL:-}                     # kontakt v podmínkách a GDPR
      - PublicBaseUrl=${APP_PUBLIC_URL:-http://localhost:5002}  # sitemap.xml
    depends_on:
      api:
        condition: service_healthy
    networks:
      - realestate-network
      - traefik-network
    volumes:
      - /srv/realestate-uploads:/app/wwwroot/uploads:ro  # Serve stored photos directly from App (API port may not be publicly accessible)
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.realestate.rule=Host(`realestate.sudata.eu`)"
      - "traefik.http.routers.realestate.entrypoints=websecure"
      - "traefik.http.routers.realestate.tls=true"
      - "traefik.http.services.realestate.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  scraper:
    build:
      context: scraper
      dockerfile: Dockerfile
    container_name: realestate-scraper
    environment:
      - DB_HOST=postgres          # ← jméno service, ne "localhost"!
      - DB_PORT=5432
      - DB_NAME=realestate_dev
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD:-dev}
      - PYTHONUNBUFFERED=1
      - DOCKER=1                  # ← vypne uvicorn --reload (způsobuje hang na macOS Docker)
      # UPLOADS_BASE_PATH záměrně nenastaveno (25. 9. 2026): fotky se už při scrapu nestahují,
      # klasifikace si je bere z původní URL a soubor po sobě smaže. Ušetří ~24 GB/rok a snižuje právní riziko.
      # - UPLOADS_BASE_PATH=/app/uploads
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - API_BASE_URL=http://realestate-api:8080  # Po scrapu volá detekci duplikátů a uložená hledání v API
      - API_KEY=${API_KEY:-dev-key-change-me}    # Hlavní klíč – správcovské endpointy API
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - realestate-network
    volumes:
      # ODSTRAŇ live mount v produkci - kód musí být v image
      - ./logs/scraper:/app/logs
      - /srv/realestate-uploads:/app/uploads  # Sdílený volume: fotky stažené přímo při scraping
    restart: unless-stopped
    # command se bere z Dockerfile

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: realestate-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@realestate.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres
    networks:
      - realestate-network
    profiles:
      - tools

  mcp:
    build:
      context: mcp
      dockerfile: Dockerfile
    container_name: realestate-mcp
    environment:
      - API_BASE_URL=http://realestate-api:8080
      - API_KEY=${API_KEY:-dev-key-change-me}    # MCP jedná jako správce (poznámky z prohlídek, plný popis)
      - TRANSPORT=sse
      - PORT=8002
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - "MISTRAL_VISION_MODEL=${MISTRAL_VISION_MODEL:-mistral-medium-latest}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:8002"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - realestate-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  realestate-network:
    driver: bridge
  traefik-network:
    external: true
